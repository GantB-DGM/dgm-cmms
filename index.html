      <dt>Last done</dt><dd>${fmtDY(d(c.last))}</dd><dt>Next due</dt><dd>${fmtDY(d(c.due))} (${dueText(d(c.due))})</dd><dt>Vendor</dt><dd>${c.vendor ? esc(VENDOR[c.vendor].name) : 'Operations handles it'}</dd>
      <dt>Reminders</dt><dd>30 days before, then weekly → Operations (per Notification rules)</dd>
      <dt>Certificate</dt><dd>${c.proof ? `<button type="button" class="link" onclick="explain('viewProof')">${ic('doc')} ${esc(c.name.replace(/[^A-Za-z]+/g, '-').toLowerCase())}-${d(c.last).getFullYear()}.pdf</button>` : '<span class="late">Not on file for the last one</span>'}</dd>
      ${c.req && REQ[c.req] ? `<dt>Request</dt><dd><button type="button" class="link" onclick="openReq('${c.req}')">${c.req} · ${statusPill(REQ[c.req])}</button></dd>` : ''}
    </dl></section></div>
    ${canManage() ? `<div class="panel-foot"><div class="btn-row">
      <button type="button" class="btn btn-sm btn-primary" onclick="compDone('${c.id}')">${ic('check')}Mark done & upload proof</button>
      ${c.req && REQ[c.req] ? '' : `<button type="button" class="btn btn-sm" onclick="compReq('${c.id}')">${ic('plus')}Create request now</button>`}
      <button type="button" class="btn btn-sm" onclick="explain('editComp')">Edit</button></div></div>` : ''}`);
}
const FREQ_DAYS = { 'Quarterly':91, 'Every 6 months':182, 'Yearly':365, 'Every 2 years':730, 'Monthly':30, 'Yearly (county schedules)':365 };
function compDone(id){ const c = COMPLIANCE.find(x => x.id === id); explain('compDone', { name:c.name }, () => { c.last = iso(TODAY).slice(0, 10); c.due = iso(new Date(TODAY.getTime() + (FREQ_DAYS[c.freq] || 365) * DAY)).slice(0, 10); c.proof = true; refresh(); }); }
function compReq(id){
  const c = COMPLIANCE.find(x => x.id === id);
  explain('compReq', { name:c.name }, () => {
    const rid = `MR-2026-${String(state.seq++).padStart(4, '0')}`, site = c.site === 'all' ? 'banfield' : c.site;
    const r = { id:rid, at:iso(now()), site, loc: siteLocations(SITE[site]).common[0], cat: { fire:'fire', kitchen:'kitchen', water:'plumb', elev:'elev', vehicle:'vehicle', building:'other' }[c.cat] || 'other', pri:'planned', status:'new', by:'Compliance tracker', src:'compliance', vendor:c.vendor || undefined, due:c.due, title:c.name, desc:`${c.ref}. Due ${fmtDY(d(c.due))}.`, v:[], c:[], log:[], ev:[] };
    REQUESTS.push(r); REQ[rid] = r; c.req = rid; refresh();
  });
}
function addCompModal(){
  const opt = (arr, sel) => arr.map(([v, l]) => `<option value="${v}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`).join('');
  openModal(`<div class="modal-head"><div class="modal-title">Add compliance item</div>${X_BTN}</div>
    <div class="modal-body">
      <label class="field"><span class="field-label">What needs doing? <span class="req">*</span></span><input class="input" id="acName" placeholder="e.g. Playground safety inspection"></label>
      <div class="form-grid">
        <label class="field"><span class="field-label">Category</span><select class="select" id="acCat">${opt(Object.entries(COMP_CATS))}<option value="__new">+ New category…</option></select></label>
        <label class="field"><span class="field-label">How often</span><select class="select" id="acFreq">${opt([['Monthly','Monthly'],['Quarterly','Quarterly'],['Every 6 months','Every 6 months'],['Yearly','Yearly'],['Every 2 years','Every 2 years'],['One time','One time']], 'Yearly')}</select></label>
        <label class="field"><span class="field-label">Next due <span class="req">*</span></span><input class="input" type="date" id="acDue" value="2026-11-15"></label>
        <label class="field"><span class="field-label">Remind Operations</span><select class="select" id="acLead">${opt([['30','30 days before'],['60','60 days before'],['90','90 days before']], '30')}</select></label>
        <label class="field"><span class="field-label">Vendor</span><select class="select" id="acVendor"><option value="">Operations handles it</option>${VENDORS.map(v => `<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select></label>
        <label class="field"><span class="field-label">Requirement or reference</span><input class="input" id="acRef" placeholder="e.g. City permit, NFPA 25, insurer"></label>
      </div>
      <fieldset class="field" style="border:0"><legend class="field-label" style="margin-bottom:6px">Applies to</legend>
        <label class="check"><input type="radio" name="acScope" value="all" checked onchange="$('acSites').hidden=true"> All sites (one org-wide item)</label>
        <label class="check"><input type="radio" name="acScope" value="some" onchange="$('acSites').hidden=false"> Specific sites (one item per site)</label>
        <div id="acSites" hidden style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:8px">${SITES.map(s => `<label class="check"><input type="checkbox" value="${s.id}"> ${esc(s.name)}</label>`).join('')}</div></fieldset>
      <label class="check"><input type="checkbox" id="acProof" checked> Require a certificate or report when it’s marked done</label>
      <label class="check"><input type="checkbox" id="acReq" checked> Create a Planned request 14 days before it’s due</label>
    </div>
    <div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-primary" onclick="saveComp()">Add item</button></div>`, true);
}
function saveComp(){
  const name = $('acName').value.trim(); if (!name){ $('acName').focus(); return; }
  let cat = $('acCat').value; if (cat === '__new'){ cat = 'other'; COMP_CATS.other = 'Other'; }
  const scope = document.querySelector('input[name="acScope"]:checked').value;
  const sites = scope === 'all' ? ['all'] : [...document.querySelectorAll('#acSites input:checked')].map(x => x.value);
  if (!sites.length){ toast('Pick at least one site'); return; }
  const base = { name, cat, freq: $('acFreq').value, due: $('acDue').value, last: $('acDue').value, vendor: $('acVendor').value || null, ref: $('acRef').value.trim() || 'Internal policy', proof: true };
  closeModal();
  explain('addComp', { n: sites.length }, () => { sites.forEach((s, i) => COMPLIANCE.push({ ...base, id:'cx' + Date.now() + i, site:s })); state.comp.view = 'all'; render(); });
}

/* ════════════════════════ OPTIONAL: EQUIPMENT ════════════════════════ */
Object.assign(EXPLAIN, {
  addAsset: () => ({ title:'Add equipment', go:'OK', real:[ ['list', 'Adds an <code>Assets</code> item. The app suggests the next tag (e.g. VBS-K08) and a printable QR label.'] ] }),
  printQR: c => ({ title:`Print label for ${c.tag}`, go:'OK', real:[
    ['spfx', 'Opens a print-ready label (QR code + tag + “Scan to report a problem”) sized for 2″ × 2″ weatherproof labels, using the browser’s print dialog.'],
    ['info', 'Scanning it on any phone opens the request form with the site, location, and equipment already filled in.'] ],
    demo:'Printing isn’t available in this demo, but the QR code shown is real. Scan it to see the link.' }),
  logMiles: () => ({ title:'Update mileage', go:'Add 120 miles', real:[
    ['list', 'Saves the odometer reading on the vehicle. When it passes the service interval, the app creates the service request. No flow needed.'] ],
    demo:'Adds 120 miles to the reading.', toast:'Mileage updated' }),
  openDoc: () => ({ title:'Open manual', go:'OK', real:[ ['lib', 'Opens the manual from the <code>Equipment Docs</code> library in the SharePoint/Teams PDF viewer.'] ] })
});
const EQ_GROUPS = { kitchen:['kitchen'], building:['plumb','hvac','elec','fire','elev'], appliances:['appl'], grounds:['grounds'], vehicles:['vehicle'] };
const EQ_LABEL = { kitchen:'Kitchen', building:'Building systems', appliances:'Appliances & laundry', grounds:'Grounds', vehicles:'Vehicles' };
const assetStatusPill = a => `<span class="pill ${a.status === 'In service' ? 'p-good' : a.status === 'Needs repair' ? 'p-amber' : 'p-warn'}">${a.status}</span>`;
const condDot = a => `<span class="li-meta"><i class="dot ${a.cond === 'Good' ? 'd-good' : a.cond === 'Fair' ? 'd-amber' : 'd-warn'}"></i>${a.cond}</span>`;
function renderAssets(){
  const f = state.eq, all = ASSETS.filter(a => inScope(a.site));
  let rows = all.filter(a => (!f.site || a.site === f.site) && (!f.cat || EQ_GROUPS[f.cat].includes(a.cat)));
  if (f.q){ const q = f.q.toLowerCase(); rows = rows.filter(a => [a.tag, a.name, a.make, siteName(a.site), a.loc].join(' ').toLowerCase().includes(q)); }
  return `<div class="page">
    <div class="page-head"><div><h1 class="page-title">Equipment ${optBadge()}</h1><div class="page-sub">Kitchen equipment, building systems, and vehicles, with the repair history for each.</div></div>
      <div class="btn-row">${scopeChip()}${canManage() ? `<button type="button" class="btn btn-primary" onclick="explain('addAsset')">${ic('plus')}Add equipment</button>` : ''}</div></div>
    ${bn('<b>Assets</b> list. Requests keep an optional Asset lookup, which builds each item’s repair history. QR labels link to the form with <b>?asset=TAG</b>.')}
    <div class="filters">
      <button type="button" class="chip" aria-pressed="${!f.cat}" onclick="state.eq.cat='';render()">All<span class="n">${all.length}</span></button>
      ${Object.keys(EQ_GROUPS).map(k => `<button type="button" class="chip" aria-pressed="${f.cat === k}" onclick="state.eq.cat='${k}';render()">${EQ_LABEL[k]}<span class="n">${all.filter(a => EQ_GROUPS[k].includes(a.cat)).length}</span></button>`).join('')}
    </div>
    <div class="filters"><label class="search">${ic('search')}<input type="search" id="eqSearch" placeholder="Search tag, name, make, site" value="${esc(f.q)}" oninput="state.eq.q=this.value;render();$('eqSearch').focus();$('eqSearch').setSelectionRange(this.value.length,this.value.length)" aria-label="Search equipment"></label>
      ${scopeIds().length > 1 ? `<select class="fsel" id="eqSite" aria-label="Site" onchange="state.eq.site=this.value;render()"><option value="">All my sites</option>${[...new Set(all.map(a => a.site))].map(id => `<option value="${id}"${f.site === id ? ' selected' : ''}>${esc(siteName(id))}</option>`).join('')}</select>` : ''}</div>
    <div class="table-wrap"><table class="table"><thead><tr><th>Tag</th><th>Equipment</th><th>Where</th><th>Status</th><th>Condition</th><th class="num">Open requests</th></tr></thead>
      <tbody>${rows.length ? rows.map(a => { const open = REQUESTS.filter(r => r.asset === a.tag && OPEN.includes(r.status) && (optOn() || r.src === 'request')).length;
        return `<tr class="click" tabindex="0" onclick="openAsset('${a.tag}')" onkeydown="if(event.key==='Enter')openAsset('${a.tag}')"><td><span class="tag">${a.tag}</span></td>
        <td class="t-main">${esc(a.name)}<span class="sub">${esc(a.make)} · ${a.year}${a.miles ? ` · ${a.miles.toLocaleString()} mi` : ''}</span></td><td>${esc(siteName(a.site))}<span class="sub">${esc(a.loc)}</span></td>
        <td>${assetStatusPill(a)}</td><td>${condDot(a)}</td><td class="num">${open || '—'}</td></tr>`; }).join('') : `<tr><td colspan="6"><div class="empty">No equipment matches.</div></td></tr>`}</tbody></table></div>
  </div>`;
}
function openAsset(tag){
  const a = ASSET[tag]; state.panel = { kind:'asset', id:tag };
  const hist = REQUESTS.filter(r => r.asset === tag).sort(byNewest), spent = hist.reduce((s, r) => s + r.c.reduce((x, c) => x + c.amt, 0), 0);
  openPanel(`<div class="panel-head"><div class="panel-head-main"><div class="panel-kicker">${a.tag} · ${esc(EQ_LABEL[Object.keys(EQ_GROUPS).find(k => EQ_GROUPS[k].includes(a.cat))])}</div><h2 class="panel-title">${esc(a.name)}</h2>
      <div class="btn-row">${assetStatusPill(a)}${condDot(a)}</div></div>${X_BTN}</div>
    <div class="panel-body">
      <section class="psec"><dl class="kv"><dt>Where</dt><dd>${esc(siteName(a.site))} › ${esc(a.loc)}</dd><dt>Make</dt><dd>${esc(a.make)}</dd><dt>Installed</dt><dd>${a.year} (${2026 - a.year} years)</dd>
        ${a.miles ? `<dt>Odometer</dt><dd>${a.miles.toLocaleString()} mi · next service at ${a.nextMiles.toLocaleString()} mi ${canManage() ? `<button type="button" class="link" onclick="logMiles('${tag}')">Update</button>` : ''}</dd>` : ''}
        <dt>Repair spend</dt><dd>${money(spent)} on ${hist.length} request${hist.length === 1 ? '' : 's'}</dd>
        <dt>Manual</dt><dd><button type="button" class="link" onclick="explain('openDoc')">${ic('doc')} ${esc(a.make.split(' ')[0].toLowerCase())}-manual.pdf</button></dd></dl></section>
      <section class="psec"><div class="psec-head"><h3 class="section-label">QR label</h3><button type="button" class="link" onclick="explain('printQR',{tag:'${tag}'})">Print label</button></div>
        <div class="qr-box"><div class="qr" id="qrSpot"></div><div><div style="font-weight:600">${esc(a.name)}</div><div class="mono" style="font-size:12px">${a.tag} · ${esc(siteName(a.site))}</div>
          <div style="font-size:12px;margin-top:6px">Scan to report a problem</div></div></div>
        <button type="button" class="btn btn-sm" style="margin-top:10px" onclick="reportFor('${tag}')">${ic('plus')}Report a problem with this</button></section>
      <section class="psec"><div class="psec-head"><h3 class="section-label">Repair history</h3></div>
        ${hist.length ? `<div class="list">${hist.map(r => reqLi(r)).join('')}</div>` : '<div class="muted" style="font-size:13px">No requests yet.</div>'}</section>
    </div>`);
  const spot = $('qrSpot'), url = `https://dogoodmultnomah.sharepoint.com/sites/TBD/SitePages/MaintenanceRequests.aspx?report=1&asset=${tag}`;
  try { new QRCode(spot, { text:url, width:112, height:112, colorDark:'#0C2340', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M }); spot.title = url; }
  catch (e) { spot.innerHTML = `<div class="qr-fallback">QR appears when online<br>(${tag})</div>`; }
}
function reportFor(tag){ const a = ASSET[tag]; state.form = { ...newForm(), site:a.site, loc:a.loc, asset:tag, cat:a.cat === 'vehicle' ? 'vehicle' : a.cat }; go('report'); }
function logMiles(tag){ explain('logMiles', {}, () => { ASSET[tag].miles += 120; openAsset(tag); }); }

/* ════════════════════════ OPTIONAL: KITCHENS ════════════════════════ */
function renderKitchens(){
  const ks = SITES.filter(s => s.kitchen && inScope(s.id));
  return `<div class="page">
    <div class="page-head"><div><h1 class="page-title">Kitchens ${optBadge()}</h1><div class="page-sub">Equipment, repairs, and compliance dates for the sites with full kitchens.</div></div>${scopeChip()}</div>
    ${bn('<b>Kitchens</b> is a view, not new data: Assets + ComplianceItems + MaintenanceRequests filtered to sites where <b>Kitchen = Yes</b> (a new column on the Sites list).')}
    <div class="grid">${ks.map(s => {
      const eq = ASSETS.filter(a => a.site === s.id && a.cat === 'kitchen');
      const comp = COMPLIANCE.filter(c => c.site === s.id && c.cat === 'kitchen').sort((a, b) => d(a.due) - d(b.due));
      const reqs = REQUESTS.filter(r => r.site === s.id && (r.cat === 'kitchen' || /^Kitchen/.test(r.loc)) && OPEN.includes(r.status) && (optOn() || r.src === 'request'));
      const issues = eq.filter(a => a.status !== 'In service').length;
      return `<section class="card">
        <div class="card-head"><div><h2 class="card-title" style="font-size:16px">${esc(s.name)}</h2><div class="card-sub">PM ${esc(s.pm)} · ${issues ? `<span class="late">${issues} item${issues === 1 ? '' : 's'} need${issues === 1 ? 's' : ''} repair</span>` : 'All equipment in service'} · ${reqs.length} open kitchen request${reqs.length === 1 ? '' : 's'}</div></div>
          <button type="button" class="btn btn-sm btn-primary" onclick="state.form={...newForm(),site:'${s.id}',loc:'Kitchen',cat:'kitchen'};go('report')">${ic('plus')}Report a kitchen problem</button></div>
        <div class="section-label" style="margin-bottom:8px">Equipment</div>
        <div class="eq-grid">${eq.map(a => `<button type="button" class="eq ${a.status === 'Out of service' ? 'is-out' : a.status === 'Needs repair' ? 'is-repair' : ''}" onclick="openAsset('${a.tag}')">
          <div class="eq-name">${esc(a.name)}</div><div class="eq-state"><i class="dot ${a.status === 'In service' ? 'd-good' : a.status === 'Needs repair' ? 'd-amber' : 'd-warn'}"></i>${a.status}</div>
          <div class="eq-meta">${a.tag} · ${esc(a.make)} · ${a.year}</div></button>`).join('')}</div>
        <div class="grid g-2" style="margin-top:16px">
          <div><div class="section-label" style="margin-bottom:4px">Compliance dates</div><div class="list">${comp.map(c => { const st = compState(c); return `<button type="button" class="li" onclick="openComp('${c.id}')"><div class="li-main"><div class="li-title">${esc(c.name)}</div><div class="li-meta">${esc(c.freq)} · ${esc(c.ref)}</div></div><div class="li-right"><span class="pill ${st.cls}">${st.label}</span><span>${fmtD(d(c.due))}</span></div></button>`; }).join('')}</div></div>
          <div><div class="section-label" style="margin-bottom:4px">Open kitchen requests</div>${reqs.length ? `<div class="list">${reqs.map(r => reqLi(r)).join('')}</div>` : '<div class="muted" style="font-size:13px;padding-top:8px">None open.</div>'}</div>
        </div></section>`; }).join('') || `<div class="card empty">None of your sites has a full kitchen.</div>`}</div>
  </div>`;
}

/* ════════════════════════ BOOT ════════════════════════ */
const VIEWS = { overview:renderOverview, requests:renderRequests, schedule:renderSchedule, compliance:renderCompliance, assets:renderAssets,
  kitchens:renderKitchens, vendors:renderVendors, settings:renderSettings, mine:renderMine, report:renderReport };
Object.assign(EXPLAIN, {
  teamsRail: c => ({ title:`Teams: ${c.name}`, go:'OK', real:[[ c.name === 'Chat' ? 'teams' : c.name === 'Calendar' ? 'cal' : c.name === 'Maintenance' ? 'spfx' : 'teams', {
    Activity:'Teams’ own Activity feed. Messages from the Maintenance Requests bot show up here and in Chat.',
    Chat:'Teams chat. Direct messages from the Maintenance Requests bot land here: request confirmations, visit bookings, completions.',
    Teams:'Your teams and channels. The Operations › Maintenance channel gets a card for each new request, if that rule is on.',
    Calendar:'Your Outlook/Teams calendar. Vendor visits appear here if the optional calendar sync is on.',
    Maintenance:'This app, pinned in the Teams left rail as a personal app. It’s the same SPFx web part as the SharePoint page. No second codebase.' }[c.name]]] })
});
document.querySelectorAll('.rail-item').forEach(b => { b.tabIndex = 0; b.addEventListener('click', () => explain('teamsRail', { name: b.textContent.trim() })); });
const press = (sel, btn) => document.querySelectorAll(sel).forEach(x => x.setAttribute('aria-pressed', x === btn));
$('roleSel').addEventListener('change', e => {
  state.role = e.target.value; state.tab = null; state.form = null;
  state.rq = { view:'open', q:'', site:'', cat:'' }; state.eq = { q:'', site:'', cat:'' };
  closePanel(); render(); window.scrollTo(0, 0);
});
document.querySelectorAll('#hostSeg button').forEach(b => b.addEventListener('click', () => { document.body.classList.toggle('host-teams', b.dataset.host === 'teams'); press('#hostSeg button', b); }));
document.querySelectorAll('#themeSeg button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', b.dataset.th);
  press('#themeSeg button', b);
}));
document.querySelectorAll('#modSeg button').forEach(b => b.addEventListener('click', () => { state.mods = b.dataset.mod; press('#modSeg button', b); closePanel(); render(); }));
$('explainToggle').addEventListener('change', e => { state.explain = e.target.checked; });
$('bnToggle').addEventListener('change', e => document.body.classList.toggle('show-bn', e.target.checked));

/* ?asset=TAG → open the form pre-filled, exactly what scanning a QR label does */
const qAsset = new URLSearchParams(location.search).get('asset');
if (qAsset && ASSET[qAsset]){ state.mods = 'all'; press('#modSeg button', document.querySelector('#modSeg [data-mod="all"]')); reportFor(qAsset); }
else render();
</script>
</body>
</html>
