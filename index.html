<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DGM Maintenance Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   DGM Maintenance Requests — prototype
   Tokens follow the DGM IR design system (docs/ir-design-tokens.md
   in dgm-incident-reporting). Added: --card (IR's --white), -ink text
   variants for AA contrast, --good/--crit, chart series, dark theme.
   ═══════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --ink:#0C2340;--ink2:#4a4a4a;--ink3:#77746f;
  --rule:#e0ddd8;--rule2:#f0ede8;--bg:#faf9f7;--card:#ffffff;--hover:#f6f4f1;
  --accent:#007396;--accent-ink:#005f7c;--accent-l:#e8f4f8;--accent-b:#92c2dd;--btn:#007396;--btn-h:#005f7c;
  --warn:#f2656a;--warn-ink:#c23b41;--warn-l:#fef0f1;--warn-b:#f9a8ab;
  --amber:#b8860b;--amber-ink:#8a6508;--amber-l:#fef9e7;--amber-b:#efc03e;
  --good:#2d6a4f;--good-l:#eef3f0;--good-b:#b7d3c4;
  --info:#0C2340;--info-l:#e8edf3;--info-b:#b9cde2;
  --crit:#8a1a1a;
  --sp:#0C2340;--demo:#1a1a1a;
  --s1:#007396;--s2:#b8860b;--grid:#ece9e4;--axis:#cfcac3;
  --shadow:0 12px 40px rgba(12,35,64,.16);
  --scrim:rgba(12,35,64,.28);
  --touch:44px;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sans:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#e8edf3;--ink2:#bcc6d2;--ink3:#8d9aab;
    --rule:#2a3546;--rule2:#1e2836;--bg:#0e141c;--card:#151d28;--hover:#1a2432;
    --accent:#3fb0d6;--accent-ink:#6cc6e4;--accent-l:#0f2f3c;--accent-b:#1f5f78;--btn:#17789a;--btn-h:#1f8fb5;
    --warn:#f2656a;--warn-ink:#ff8f93;--warn-l:#3a1c21;--warn-b:#7a3439;
    --amber:#e0b04a;--amber-ink:#e9c268;--amber-l:#30270f;--amber-b:#6b5520;
    --good:#6fcf9a;--good-l:#132a1f;--good-b:#2c6048;
    --info:#a9c4e4;--info-l:#18253a;--info-b:#35506e;
    --crit:#b3261e;--sp:#08182d;--demo:#050505;
    --s1:#1f8fb5;--s2:#b98a1e;--grid:#222d3b;--axis:#344255;
    --shadow:0 12px 40px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#e8edf3;--ink2:#bcc6d2;--ink3:#8d9aab;
  --rule:#2a3546;--rule2:#1e2836;--bg:#0e141c;--card:#151d28;--hover:#1a2432;
  --accent:#3fb0d6;--accent-ink:#6cc6e4;--accent-l:#0f2f3c;--accent-b:#1f5f78;--btn:#17789a;--btn-h:#1f8fb5;
  --warn:#f2656a;--warn-ink:#ff8f93;--warn-l:#3a1c21;--warn-b:#7a3439;
  --amber:#e0b04a;--amber-ink:#e9c268;--amber-l:#30270f;--amber-b:#6b5520;
  --good:#6fcf9a;--good-l:#132a1f;--good-b:#2c6048;
  --info:#a9c4e4;--info-l:#18253a;--info-b:#35506e;
  --crit:#b3261e;--sp:#08182d;--demo:#050505;
  --s1:#1f8fb5;--s2:#b98a1e;--grid:#222d3b;--axis:#344255;
  --shadow:0 12px 40px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;height:100%;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;min-height:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.mono{font-family:var(--mono);}
.muted{color:var(--ink3);}
.tnum{font-variant-numeric:tabular-nums;}
h1,h2,h3{font-weight:500;text-wrap:balance;}
[hidden]{display:none!important;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ── Demo bar (prototype controls — not part of the product) ── */
.demo-bar{background:var(--demo);color:#fff;padding:8px 16px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;font-size:12px;}
.demo-tag{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.demo-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;}
.demo-group{display:flex;align-items:center;gap:6px;}
.demo-group label{color:rgba(255,255,255,.55);font-size:11px;white-space:nowrap;}
.demo-select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;min-width:0;}
.demo-select option{background:#1a1a1a;color:#fff;}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:6px;overflow:hidden;}
.seg button{background:transparent;border:0;color:rgba(255,255,255,.7);padding:5px 10px;font-size:12px;}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.18);color:#fff;}
.demo-check{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);font-size:12px;cursor:pointer;white-space:nowrap;}
.demo-check input{accent-color:#4ade80;}
.demo-note{color:rgba(255,255,255,.4);font-size:11px;margin-left:auto;}
@media (max-width:760px){.demo-note{display:none;}}

/* ── SharePoint host chrome ── */
.sp-bar{background:var(--sp);min-height:48px;display:flex;align-items:center;padding:0 16px;gap:10px;color:#fff;}
.sp-waffle{width:20px;height:20px;display:grid;grid-template-columns:repeat(3,4px);gap:3px;align-content:center;justify-content:center;opacity:.9;}
.sp-waffle i{width:4px;height:4px;background:#fff;border-radius:1px;}
.sp-name{font-size:13px;font-weight:500;}
.sp-sub{font-size:12px;color:rgba(255,255,255,.7);}
.sp-user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.9);min-width:0;}
.sp-role{background:rgba(255,255,255,.18);border-radius:20px;padding:2px 9px;font-size:10px;white-space:nowrap;}
.avatar{width:28px;height:28px;border-radius:50%;background:#d9e6ee;color:#0C2340;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
@media (max-width:560px){.sp-sub,.sp-uname{display:none;}}

/* ── Teams host chrome ── */
.host-frame{display:flex;min-height:calc(100vh - 44px);}
.teams-rail{display:none;width:64px;flex-shrink:0;background:#ebebf2;border-right:1px solid #dcdce6;flex-direction:column;align-items:center;padding-top:8px;gap:2px;}
.rail-item{width:56px;padding:8px 0 6px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5c5c70;font-size:10px;border:0;background:transparent;}
.rail-item svg{width:20px;height:20px;}
.rail-item.on{color:#4f52b2;background:#fff;}
.rail-item.on::before{content:"";position:absolute;}
.teams-head{display:none;background:#ebebf2;border-bottom:1px solid #dcdce6;padding:10px 20px 0;color:#242424;}
.teams-app{display:flex;align-items:center;gap:10px;}
.teams-appicon{width:28px;height:28px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;}
.teams-appicon svg{width:16px;height:16px;}
.teams-title{font-size:16px;font-weight:600;}
.teams-sub{font-size:12px;color:#616161;}
.host-main{flex:1;min-width:0;display:flex;flex-direction:column;}
body.host-teams .sp-bar{display:none;}
body.host-teams .teams-rail{display:flex;}
body.host-teams .teams-head{display:block;}
body.host-teams .site-nav{background:#ebebf2;border-bottom-color:#dcdce6;}
body.host-teams .nav-tab{color:#616161;}
body.host-teams .nav-tab.active{color:#4f52b2;border-bottom-color:#4f52b2;}
:root[data-theme="dark"] body.host-teams .teams-rail,:root[data-theme="dark"] body.host-teams .teams-head,:root[data-theme="dark"] body.host-teams .site-nav{background:#1f1f1f;border-color:#2e2e2e;color:#fff;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body.host-teams .teams-rail,:root:not([data-theme="light"]) body.host-teams .teams-head,:root:not([data-theme="light"]) body.host-teams .site-nav{background:#1f1f1f;border-color:#2e2e2e;color:#fff;}
}
@media (max-width:640px){body.host-teams .teams-rail{display:none;}}

/* ── Tab nav ── */
.site-nav{background:var(--card);border-bottom:1px solid var(--rule);padding:0 16px;display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;}
.site-nav::-webkit-scrollbar{display:none;}
.nav-tab{padding:0 14px;font-size:13px;color:var(--ink3);border:0;border-bottom:2px solid transparent;background:transparent;white-space:nowrap;min-height:44px;display:flex;align-items:center;gap:6px;}
.nav-tab:hover{color:var(--ink);}
.nav-tab.active{color:var(--ink);font-weight:500;border-bottom-color:var(--ink);}
.nav-count{font-size:10px;font-weight:600;background:var(--amber-l);color:var(--amber-ink);border:1px solid var(--amber-b);border-radius:10px;padding:0 6px;line-height:16px;}
.nav-spacer{flex:1;}
.nav-tab.cta{color:var(--accent-ink);font-weight:500;}

/* ── Page layout ── */
.page{max-width:1160px;margin:0 auto;padding:22px 16px 80px;}
.page-sm{max-width:780px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.page-title{font-size:18px;font-weight:500;line-height:1.3;}
.page-sub{font-size:13px;color:var(--ink3);margin-top:2px;}
.scope-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:3px 10px;}
.scope-chip b{font-weight:500;color:var(--ink);}
.grid{display:grid;gap:14px;}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);}
@media (max-width:900px){.g-main,.g-3{grid-template-columns:minmax(0,1fr);}}
@media (max-width:640px){.g-2{grid-template-columns:minmax(0,1fr);}}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;min-width:0;}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.card-title{font-size:14px;font-weight:500;color:var(--ink);}
.card-sub{font-size:12px;color:var(--ink3);}
.section-label{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);}
.link{color:var(--accent-ink);background:none;border:0;font-size:12px;font-weight:500;padding:0;text-decoration:none;}
.link:hover{text-decoration:underline;}

/* ── Stat tiles ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px;}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));}}
.hcol rect{fill:transparent;}
.hcol line{stroke:var(--axis);stroke-width:1;opacity:0;}
.hcol:hover line{opacity:1;}
.hbar-row-btn{display:contents;cursor:pointer;}
.hbar-row-btn:focus-visible .hbar-label{outline:2px solid var(--accent);outline-offset:2px;}
.hbar-row-btn:hover .hbar-label{color:var(--accent-ink);}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;text-align:left;border-left-width:1px;}
button.tile{cursor:pointer;}
button.tile:hover{border-color:var(--accent-b);}
.tile-label{font-size:12px;color:var(--ink3);font-weight:500;}
.tile-val{font-size:28px;font-weight:500;line-height:1.15;margin-top:4px;color:var(--ink);}
.tile-sub{font-size:12px;color:var(--ink3);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tile.is-warn{border-left:3px solid var(--warn);}
.tile.is-amber{border-left:3px solid var(--amber-b);}

/* ── Pills (status, priority, misc) ── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;padding:0 8px;border-radius:20px;font-weight:500;white-space:nowrap;border:1px solid transparent;}
.pill svg{width:11px;height:11px;}
.p-new{background:var(--amber-l);color:var(--amber-ink);border-color:var(--amber-b);}
.p-scheduled{background:var(--info-l);color:var(--info);border-color:var(--info-b);}
.p-inprog{background:var(--accent-l);color:var(--accent-ink);border-color:var(--accent-b);}
.p-waiting{background:var(--rule2);color:var(--ink2);border-color:var(--rule);}
.p-done{background:var(--good-l);color:var(--good);border-color:var(--good-b);}
.p-cancelled{background:transparent;color:var(--ink3);border-color:var(--rule);text-decoration:line-through;}
.p-emergency{background:var(--crit);color:#fff;}
.p-urgent{background:var(--warn-l);color:var(--warn-ink);border-color:var(--warn-b);}
.p-routine{background:var(--info-l);color:var(--info);border-color:var(--info-b);}
.p-planned{background:var(--accent-l);color:var(--accent-ink);border-color:var(--accent-b);}
.p-good{background:var(--good-l);color:var(--good);border-color:var(--good-b);}
.p-warn{background:var(--warn-l);color:var(--warn-ink);border-color:var(--warn-b);}
.p-amber{background:var(--amber-l);color:var(--amber-ink);border-color:var(--amber-b);}
.p-neutral{background:var(--rule2);color:var(--ink2);border-color:var(--rule);}
.p-crit{background:var(--crit);color:#fff;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.d-good{background:var(--good);} .d-warn{background:var(--warn);} .d-amber{background:var(--amber);} .d-neutral{background:var(--ink3);} .d-crit{background:var(--crit);}
.tag{font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--rule2);border-radius:4px;padding:0 5px;white-space:nowrap;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--rule);background:var(--card);color:var(--ink);white-space:nowrap;}
.btn:hover{background:var(--hover);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--btn);border-color:var(--btn);color:#fff;}
.btn-primary:hover{background:var(--btn-h);border-color:var(--btn-h);}
.btn-danger{color:var(--warn-ink);border-color:var(--warn-b);}
.btn-sm{min-height:30px;padding:0 10px;font-size:12px;}
.btn-lg{min-height:var(--touch);padding:0 20px;font-size:14px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* ── Filters ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:20px;border:1px solid var(--rule);background:var(--card);font-size:12px;color:var(--ink2);}
.chip:hover{border-color:var(--accent-b);}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);}
.chip .n{font-size:11px;opacity:.75;}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:0 10px;min-height:32px;flex:1 1 200px;max-width:320px;}
.search svg{width:14px;height:14px;color:var(--ink3);flex-shrink:0;}
.search input{border:0;background:transparent;outline:none;font-size:13px;width:100%;min-width:0;min-height:30px;}
.fsel{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:0 28px 0 10px;min-height:32px;font-size:12px;color:var(--ink2);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;}

/* ── Tables ── */
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--card);}
.table{width:100%;border-collapse:collapse;font-size:13px;}
.table th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--bg);white-space:nowrap;}
.table td{padding:10px 12px;border-bottom:1px solid var(--rule2);color:var(--ink2);vertical-align:middle;}
.table tr:last-child td{border-bottom:0;}
.table tbody tr.click{cursor:pointer;}
.table tbody tr.click:hover td{background:var(--hover);}
.table td.t-main{color:var(--ink);font-weight:500;}
.table .sub{display:block;font-size:12px;color:var(--ink3);font-weight:400;}
.table td.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums;}
.pri-cell{position:relative;padding-left:16px!important;}
.pri-cell::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:0 3px 3px 0;background:var(--pri,transparent);}
.pr-emergency{--pri:var(--crit);} .pr-urgent{--pri:var(--warn);} .pr-routine{--pri:var(--info-b);} .pr-planned{--pri:var(--accent-b);}
.late{color:var(--warn-ink);font-weight:500;}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:13px;}

/* ── Lists (needs attention, coming up) ── */
.list{display:flex;flex-direction:column;}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule2);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;}
.li:last-child{border-bottom:0;}
button.li:hover .li-title{color:var(--accent-ink);}
.li-main{flex:1;min-width:0;}
.li-title{font-size:13px;font-weight:500;color:var(--ink);overflow-wrap:anywhere;}
.li-meta{font-size:12px;color:var(--ink3);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;}
.li-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--ink3);}
.datebox{width:44px;flex-shrink:0;text-align:center;border:1px solid var(--rule);border-radius:8px;padding:3px 0;background:var(--bg);}
.datebox .m{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);display:block;line-height:1.3;}
.datebox .d{font-size:16px;font-weight:500;display:block;line-height:1.2;}

/* ── Charts ── */
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:6px 12px;align-items:center;}
.hbar-label{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbar-track{position:relative;height:22px;display:flex;align-items:center;}
.hbar-bar{height:14px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px;}
.hbar-val{font-size:12px;color:var(--ink);margin-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.hbar-row{display:contents;}
.hbar-row:hover .hbar-bar{filter:brightness(1.12);}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px;}
.chart-legend span{display:inline-flex;align-items:center;gap:6px;}
.key{width:14px;height:3px;border-radius:2px;display:inline-block;}
.chart-svg{width:100%;height:auto;display:block;overflow:visible;}
.chart-svg text{fill:var(--ink3);font-size:11px;font-family:var(--sans);}
.chart-svg .end-label{fill:var(--ink);font-weight:500;}
.chart-table summary{font-size:12px;color:var(--ink3);cursor:pointer;margin-top:8px;}
.chart-table table{margin-top:6px;}
.tip{position:fixed;z-index:900;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:6px;max-width:260px;box-shadow:var(--shadow);}
.tip b{font-weight:600;}

/* ── Timeline (recurring services) ── */
.tl{display:grid;grid-template-columns:minmax(170px,230px) repeat(13,minmax(34px,1fr));min-width:720px;}
.tl-h{font-size:10px;color:var(--ink3);text-align:center;padding:6px 0;border-bottom:1px solid var(--rule);white-space:nowrap;}
.tl-h.now,.tl-c.now{background:var(--accent-l);}
.tl-name{padding:8px 10px 8px 0;border-bottom:1px solid var(--rule2);font-size:12px;color:var(--ink);min-width:0;}
.tl-name .sub{display:block;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-c{border-bottom:1px solid var(--rule2);display:flex;align-items:center;justify-content:center;border-left:1px solid var(--rule2);}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--s1);border:2px solid var(--card);box-shadow:0 0 0 1px var(--s1);cursor:default;}
.tl-dot.comp{background:var(--s2);box-shadow:0 0 0 1px var(--s2);}

/* ── Agenda (upcoming visits) ── */
.agenda-day{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--rule2);}
.agenda-day:last-child{border-bottom:0;}
.agenda-date{font-size:12px;color:var(--ink3);line-height:1.3;}
.agenda-date b{display:block;font-size:14px;color:var(--ink);font-weight:500;}
.agenda-date.today b{color:var(--accent-ink);}
.visit{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;margin:0 -8px;border-radius:8px;text-align:left;background:none;border:0;width:calc(100% + 16px);}
.visit:hover{background:var(--hover);}
.visit-time{font-size:12px;color:var(--ink2);width:88px;flex-shrink:0;font-variant-numeric:tabular-nums;padding-top:1px;}
.visit-body{min-width:0;flex:1;}

/* ── Slide-in panel ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:200;opacity:0;pointer-events:none;transition:opacity .18s;}
.scrim.open{opacity:1;pointer-events:auto;}
.panel{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100%;background:var(--card);z-index:210;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;}
.panel.open{transform:none;}
.panel-head{padding:16px 20px 14px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start;}
.panel-head-main{flex:1;min-width:0;}
.panel-kicker{font-family:var(--mono);font-size:11px;color:var(--ink3);}
.panel-title{font-size:17px;font-weight:500;line-height:1.35;margin:2px 0 8px;}
.panel-body{flex:1;overflow-y:auto;padding:4px 20px 20px;}
.panel-foot{border-top:1px solid var(--rule);padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);}
.x-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--rule);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink2);}
.x-btn svg{width:16px;height:16px;}
.psec{padding:16px 0;border-bottom:1px solid var(--rule2);}
.psec:last-child{border-bottom:0;}
.psec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13px;}
.kv dt{color:var(--ink3);}
.kv dd{color:var(--ink);min-width:0;overflow-wrap:anywhere;}
.desc{font-size:14px;color:var(--ink);line-height:1.6;white-space:pre-line;}
.target-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:14px;}
.target-bar.ok{background:var(--accent-l);color:var(--accent-ink);}
.target-bar.late{background:var(--warn-l);color:var(--warn-ink);}
.target-bar.done{background:var(--good-l);color:var(--good);}
.target-bar svg{width:16px;height:16px;flex-shrink:0;}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.photo{width:84px;height:64px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--rule2) 0 8px,var(--bg) 8px 16px);border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--ink3);}
.photo svg{width:16px;height:16px;}
.vendor-card{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;}
.vendor-card .vc-main{flex:1;min-width:0;}
.vc-name{font-weight:500;font-size:14px;}
.vc-line{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-top:2px;}
.vc-line svg{width:13px;height:13px;color:var(--ink3);}
.note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink2);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;}
.note svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;color:var(--ink3);}
.note.amber{background:var(--amber-l);border-color:var(--amber-b);color:var(--amber-ink);}
.note.amber svg{color:var(--amber-ink);}
.note.warn{background:var(--warn-l);border-color:var(--warn-b);color:var(--warn-ink);}
.note.warn svg{color:var(--warn-ink);}
.visit-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--rule);}
.visit-row:last-child{border-bottom:0;}
.cost-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--rule2);}
.cost-total{display:flex;justify-content:space-between;font-weight:500;font-size:14px;padding-top:8px;}

/* ── Activity timeline ── */
.act{position:relative;padding-left:26px;}
.act::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:1px;background:var(--rule);}
.act-item{position:relative;padding:0 0 12px;font-size:13px;}
.act-ico{position:absolute;left:-26px;top:0;width:19px;height:19px;border-radius:50%;background:var(--card);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink3);}
.act-ico svg{width:11px;height:11px;}
.act-ico.teams{color:#4f52b2;border-color:#c5c6ea;}
.act-ico.mail{color:var(--accent-ink);border-color:var(--accent-b);}
.act-text{color:var(--ink);}
.act-meta{font-size:11px;color:var(--ink3);}
.act-comment{margin-top:4px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;color:var(--ink2);font-size:13px;}

/* ── Forms ── */
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field-label{font-size:12px;font-weight:500;color:var(--ink2);}
.field-hint{font-size:12px;color:var(--ink3);line-height:1.45;}
.req{color:var(--warn-ink);}
.input,.select,.textarea{width:100%;min-height:var(--touch);padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card);font-size:14px;color:var(--ink);}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;}
.textarea{min-height:96px;resize:vertical;line-height:1.5;}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l);}
.form-sec{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
.form-sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.step-n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--card);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.form-sec-title{font-size:15px;font-weight:500;}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;}
@media (max-width:600px){.form-grid{grid-template-columns:minmax(0,1fr);}}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;}
.cat-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--card);text-align:left;font-size:13px;color:var(--ink);min-height:78px;}
.cat-btn svg{width:20px;height:20px;color:var(--accent-ink);}
.cat-btn:hover{border-color:var(--accent-b);}
.cat-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-l);box-shadow:inset 0 0 0 1px var(--accent);}
.yn{display:flex;gap:8px;flex-wrap:wrap;}
.yn button{flex:1 1 160px;min-height:var(--touch);border:1px solid var(--rule);border-radius:8px;background:var(--card);font-size:14px;color:var(--ink2);padding:8px 12px;}
.yn button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-l);color:var(--accent-ink);font-weight:500;}
.yn button.danger[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-l);color:var(--warn-ink);}
.q{font-size:14px;color:var(--ink);font-weight:500;margin-bottom:8px;}
.emerg{border:1px solid var(--warn-b);background:var(--warn-l);border-radius:10px;padding:14px 16px;color:var(--ink);margin-top:12px;}
.emerg-title{font-weight:600;color:var(--warn-ink);display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.emerg-title svg{width:18px;height:18px;}
.emerg ol{padding-left:20px;font-size:13px;line-height:1.7;}
.result-pri{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--ink2);flex-wrap:wrap;}
.upload{border:1.5px dashed var(--rule);border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);cursor:pointer;}
.check input{width:17px;height:17px;accent-color:var(--accent);margin-top:2px;flex-shrink:0;}
.confirm{text-align:center;padding:30px 20px;}
.confirm-ico{width:52px;height:52px;border-radius:50%;background:var(--good-l);color:var(--good);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.confirm-ico svg{width:26px;height:26px;}
.next-steps{text-align:left;max-width:460px;margin:18px auto;display:flex;flex-direction:column;gap:10px;}
.next-step{display:flex;gap:10px;font-size:13px;color:var(--ink2);align-items:flex-start;}
.next-step svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;}

/* ── My requests cards ── */
.req-card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;text-align:left;width:100%;display:block;}
.req-card:hover{border-color:var(--accent-b);}
.req-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.stepper{display:flex;margin-top:14px;gap:4px;}
.stp{flex:1;min-width:0;}
.stp-bar{height:4px;border-radius:2px;background:var(--rule);}
.stp.on .stp-bar{background:var(--accent);}
.stp-l{font-size:11px;color:var(--ink3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stp.on .stp-l{color:var(--ink2);}
.stp.cur .stp-l{color:var(--ink);font-weight:500;}
.req-update{margin-top:12px;font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start;}
.req-update svg{width:14px;height:14px;flex-shrink:0;margin-top:3px;color:var(--ink3);}

/* ── Kitchens ── */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;}
.eq{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;text-align:left;background:var(--card);}
.eq:hover{border-color:var(--accent-b);}
.eq-name{font-size:13px;font-weight:500;color:var(--ink);}
.eq-state{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-top:4px;}
.eq-meta{font-size:11px;color:var(--ink3);margin-top:2px;}
.eq.is-out{border-color:var(--warn-b);background:var(--warn-l);}
.eq.is-repair{border-color:var(--amber-b);}

/* ── Condition meter ── */
.meter{width:72px;height:6px;border-radius:3px;background:var(--rule2);overflow:hidden;display:inline-block;vertical-align:middle;}
.meter i{display:block;height:100%;border-radius:3px;}
.life{height:8px;border-radius:4px;background:var(--rule2);overflow:hidden;margin:6px 0 4px;}
.life i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0;}
.life.warn i{background:var(--warn);}
.qr-box{display:flex;gap:16px;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:14px;background:#fff;color:#0C2340;flex-wrap:wrap;}
.qr-box .qr{width:112px;height:112px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.qr-box .qr img,.qr-box .qr canvas{width:112px!important;height:112px!important;}
.qr-fallback{width:112px;height:112px;border:1px dashed #b9b9b9;display:flex;align-items:center;justify-content:center;font-size:10px;color:#777;text-align:center;padding:6px;}

/* ── Modal ── */
.modal-wrap{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim);}
.modal{background:var(--card);border-radius:12px;box-shadow:var(--shadow);width:560px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;}
.modal.wide{width:720px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule);}
.modal-title{font-size:16px;font-weight:500;}
.modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.modal-foot{padding:12px 20px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:8px;background:var(--bg);border-radius:0 0 12px 12px;flex-wrap:wrap;}

/* ── Notification previews (Teams card / Outlook email) ── */
.pv-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.pv-stage{background:#f5f5f5;border-radius:10px;padding:16px;color:#242424;}
.tm-msg{display:flex;gap:10px;align-items:flex-start;}
.tm-bot{width:32px;height:32px;border-radius:6px;background:#007396;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tm-bot svg{width:16px;height:16px;}
.tm-meta{font-size:12px;color:#616161;margin-bottom:4px;}
.tm-meta b{color:#242424;font-weight:600;}
.tm-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;max-width:420px;}
.tm-card-band{height:4px;background:#007396;}
.tm-card-band.em{background:#b3261e;}
.tm-card-body{padding:12px 14px;}
.tm-card-title{font-weight:600;font-size:14px;margin-bottom:2px;}
.tm-facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin:10px 0;}
.tm-facts dt{color:#616161;}
.tm-actions{display:flex;gap:8px;border-top:1px solid #eee;padding:10px 14px;flex-wrap:wrap;}
.tm-btn{border:1px solid #d1d1d1;border-radius:4px;padding:4px 12px;font-size:12px;font-weight:600;background:#fff;color:#242424;}
.tm-btn.pri{background:#5b5fc7;border-color:#5b5fc7;color:#fff;}
.tm-channel{font-size:12px;color:#616161;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.em-wrap{background:#fff;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;color:#242424;}
.em-head{padding:12px 14px;border-bottom:1px solid #eee;display:grid;grid-template-columns:60px 1fr;gap:3px 8px;font-size:12px;}
.em-head dt{color:#616161;}
.em-subj{font-weight:600;font-size:14px;}
.em-body{padding:14px;line-height:1.6;}
.em-body .em-btn{display:inline-block;background:#007396;color:#fff;border-radius:4px;padding:6px 14px;font-weight:600;font-size:12px;margin-top:8px;}

/* ── Settings: notification rules ── */
.rule-row{display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(0,2fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--rule2);}
.rule-row:last-child{border-bottom:0;}
.rule-ev{font-size:13px;font-weight:500;color:var(--ink);}
.rule-ev .sub{display:block;font-size:12px;color:var(--ink3);font-weight:400;margin-top:2px;}
.rule-rcp{display:flex;flex-direction:column;gap:8px;}
.rcp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.rcp-who{font-size:12px;color:var(--ink2);width:130px;flex-shrink:0;}
.ch{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--rule);background:var(--card);font-size:12px;color:var(--ink3);}
.ch svg{width:13px;height:13px;}
.ch[aria-pressed="true"]{border-color:var(--accent-b);background:var(--accent-l);color:var(--accent-ink);font-weight:500;}
.ch:disabled{opacity:.45;cursor:not-allowed;}
.rule-row.off .rule-ev{color:var(--ink3);}
@media (max-width:700px){.rule-row{grid-template-columns:minmax(0,1fr);}.rcp-who{width:100%;}}

/* ── Build notes (demo toggle) ── */
.bn{display:none;font-family:var(--mono);font-size:11px;line-height:1.5;color:#6b4fa0;background:rgba(107,79,160,.07);border:1px dashed rgba(107,79,160,.45);border-radius:6px;padding:6px 9px;margin:0 0 12px;}
.bn b{font-weight:500;}
body.show-bn .bn{display:block;}
:root[data-theme="dark"] .bn{color:#c3aef0;background:rgba(195,174,240,.08);border-color:rgba(195,174,240,.4);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bn{color:#c3aef0;background:rgba(195,174,240,.08);border-color:rgba(195,174,240,.4);}}

/* ── Toast ── */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .2s;z-index:950;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast svg{width:15px;height:15px;flex-shrink:0;}

/* ── Banner ── */
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid var(--accent-b);background:var(--accent-l);color:var(--accent-ink);font-size:13px;margin-bottom:14px;flex-wrap:wrap;}
.banner svg{width:16px;height:16px;flex-shrink:0;}
.banner.amber{border-color:var(--amber-b);background:var(--amber-l);color:var(--amber-ink);}

svg.i{width:16px;height:16px;flex-shrink:0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ── "What this button does" modal ── */
.real-steps{display:flex;flex-direction:column;gap:10px;}
.real-step{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink);line-height:1.5;}
.real-step svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--accent-ink);}
.real-step code,.note code{font-family:var(--mono);font-size:12px;background:var(--rule2);border-radius:4px;padding:0 4px;}
.opt-badge{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b4fa0;border:1px solid rgba(107,79,160,.45);border-radius:4px;padding:0 4px;line-height:14px;}
:root[data-theme="dark"] .opt-badge{color:#c3aef0;border-color:rgba(195,174,240,.4);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt-badge{color:#c3aef0;border-color:rgba(195,174,240,.4);}}
.inline-form{border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.inline-form .input,.inline-form .select{min-height:38px;font-size:13px;padding:7px 10px;}
.row-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
@media (max-width:480px){.row-2{grid-template-columns:minmax(0,1fr);}}

    motel:['Front office','Laundry room','Parking lot','Exterior stairs & walkways','Housekeeping closet'],

    admin:['Reception','Offices','Conference room','Break room','Restrooms','Server closet','Parking']
  }[s.type].slice();
  if (s.kitchen) common.splice(1, 0, 'Kitchen', 'Kitchen — walk-ins', 'Kitchen — dry storage');
  common.push(...(EXTRA_LOC[s.id] || []));
  const units = [];
  if (s.type === 'village') for (let i = 1; i <= 30; i++) units.push('Pod ' + i);
  if (s.type === 'motel') [1, 2].forEach(f => { for (let i = 1; i <= 20; i++) units.push('Room ' + (f * 100 + i)); });
  if (s.type === 'psh') [1, 2, 3].forEach(f => { for (let i = 1; i <= 12; i++) units.push('Unit ' + (f * 100 + i)); });
  return { common, units, unitLabel: { village:'Pods', motel:'Rooms', psh:'Apartments' }[s.type] || null };
}

/* ════════ Generated history (seeded so every scope sums consistently) ════════ */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const WEEKS = Array.from({ length:12 }, (_, i) => new Date(2026, 6, 5 + i * 7));   // week ending Sun Jul 5 … Sep 20
const RATE = { congregate:1.5, psh:1.1, village:1.2, motel:0.9, day:0.8, admin:0.35 };
const TREND = {};           // site → { opened:[12], closed:[12] }
SITES.forEach((s, i) => {
  const r = rng(1000 + i * 17), k = RATE[s.type];
  TREND[s.id] = { opened: WEEKS.map(() => Math.round(k * (0.45 + r() * 1.1))), closed: WEEKS.map(() => Math.round(k * (0.4 + r() * 1.1))) };
});
const SPEND_BASE = { congregate:2600, psh:3100, village:1900, motel:1500, day:1100, admin:700 };
const SPEND_W = { plumb:.18, hvac:.2, elec:.08, doors:.07, roof:.08, pest:.1, appl:.05, grounds:.08, fire:.06, struct:.04, other:.02 };
const SPEND = {};           // site → { cat: $ } for Jul 1 – Sep 8 (costs on REQUESTS are added on top)
SITES.forEach((s, i) => {
  const r = rng(5000 + i * 31), row = {};
  const w = { ...SPEND_W, ...(s.kitchen ? { kitchen:.12 } : {}), ...(s.type === 'psh' ? { elev:.09 } : {}), ...(['npdc','banfield'].includes(s.id) ? { vehicle:.07 } : {}) };
  Object.entries(w).forEach(([c, wt]) => { row[c] = Math.round(SPEND_BASE[s.type] * wt * (0.6 + r() * 0.9) / 5) * 5; });
  SPEND[s.id] = row;
});

/* Response targets: Emergency 4 h · Urgent 2 days · Routine 14 days (time until a vendor is on site). */
function targetOf(r){ if (r.pri === 'planned') return r.due ? d(r.due) : null; return new Date(d(r.at).getTime() + PRI[r.pri].hours * HOUR); }
function firstVisit(r){ return r.v.length ? r.v.map(v => d(v.at)).sort((a, b) => a - b)[0] : null; }
function nextVisit(r){ return r.v.filter(v => !v.done && d(v.at) >= sod(TODAY)).map(v => d(v.at)).sort((a, b) => a - b)[0] || null; }
function isLate(r){
  if (!OPEN.includes(r.status)) return false;
  const t = targetOf(r); if (!t) return false;
  if (r.pri === 'planned') return TODAY > t;
  const f = firstVisit(r); return f ? f > t : TODAY > t;
}
function targetInfo(r){
  if (r.status === 'done') return { cls:'done', icon:'check', text:`Completed ${fmtDT(d(r.done))}` };
  if (r.status === 'cancelled') return { cls:'done', icon:'x', text:'Cancelled' };
  const t = targetOf(r), f = firstVisit(r);
  if (r.pri === 'planned') return isLate(r) ? { cls:'late', icon:'alert', text:`Due ${fmtDY(t)}, now ${-daysFromToday(t)} days overdue` } : { cls:'ok', icon:'cal', text:`Due ${fmtDY(t)}` };
  if (isLate(r)) return f ? { cls:'late', icon:'alert', text:`Vendor booked ${fmtDT(f)}, after the ${PRI[r.pri].target} target (${fmtDT(t)})` } : { cls:'late', icon:'alert', text:`No response yet. The ${PRI[r.pri].target} target passed ${ago(t)}.` };
  return f ? { cls:'ok', icon:'check', text:`Vendor on site ${fmtDT(f)}, within the ${PRI[r.pri].target} target` } : { cls:'ok', icon:'clock', text:`Respond by ${fmtDT(t)} (${PRI[r.pri].target} target)` };
}

let toastTimer;
function toast(msg){ const t = $('toast'); t.innerHTML = ic('check') + `<span>${msg}</span>`; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
function tipAt(x, y, html){ const t = $('tip'); t.innerHTML = html; t.hidden = false; const w = t.offsetWidth, h = t.offsetHeight; t.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + 'px'; t.style.top = (y + 16 + h > innerHeight ? y - h - 12 : y + 16) + 'px'; }
document.addEventListener('mousemove', e => { const el = e.target.closest?.('[data-tip]'); if (el) tipAt(e.clientX, e.clientY, el.dataset.tip); else $('tip').hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest?.('[data-tip]'); if (el){ const b = el.getBoundingClientRect(); tipAt(b.left, b.bottom - 8, el.dataset.tip); } });

function copyText(text){
  const done = () => toast('Copied to clipboard');

}
function fallbackCopy(text, done){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy isn’t available in this browser'); } ta.remove(); }

function upcomingVisits(days, list){
  const end = new Date(sod(TODAY).getTime() + days * DAY), out = [];
  (list || reqsInScope()).forEach(r => { if (!OPEN.includes(r.status)) return; r.v.forEach(v => { const t = d(v.at); if (!v.done && t >= sod(TODAY) && t < end) out.push({ r, v, t }); }); });

}

/* ── Charts ── */
function niceMax(v){ if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function hbars(rows, fmt, onclick){
  if (!rows.length) return `<div class="empty">Nothing to show.</div>`;
  const max = Math.max(...rows.map(r => r.v));
  return `<div class="hbar">${rows.map(r => `
    <div class="hbar-row-btn" ${onclick ? `role="button" tabindex="0" onclick="${onclick(r)}" onkeydown="if(event.key==='Enter')this.click()"` : 'tabindex="0"'} data-tip="${esc(r.tip)}">
      <div class="hbar-label">${esc(r.label)}</div>
      <div class="hbar-track"><div class="hbar-bar" style="width:${Math.max(1.5, r.v / max * 82)}%"></div><span class="hbar-val">${fmt(r.v)}</span></div>
    </div>`).join('')}</div>`;
}
function lineChart(series, labels, tipLabel){
  const W = 560, H = 210, L = 30, R = 40, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
  const raw = Math.max(1, ...series.flatMap(s => s.values));
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 250, 500, 1000].find(s => raw / s <= 5) || 1000;
  const max = Math.ceil(raw / step) * step;
  const x = i => L + i * iw / (labels.length - 1), y = v => T + ih - v / max * ih;
  const ticks = Array.from({ length: max / step + 1 }, (_, i) => i * step);
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" class="tnum">${t}</text>`).join('');
  const xl = labels.map((l, i) => i % 2 === 1 || i === labels.length - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${l}</text>` : '').join('');
  const lines = series.map(s => `<path d="${s.values.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const last = labels.length - 1, ends = series.map(s => ({ s, yy: y(s.values[last]) }));
  const collide = ends.length > 1 && Math.abs(ends[0].yy - ends[1].yy) < 14;
  const dots = ends.map(({ s, yy }) => `<circle cx="${x(last)}" cy="${yy}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>${collide ? '' : `<text x="${x(last) + 9}" y="${yy + 4}" class="end-label tnum">${s.values[last]}</text>`}`).join('');
  const cols = labels.map((l, i) => `<g class="hcol" data-tip="${esc(`<b>${tipLabel(i)}</b><br>` + series.map(s => `${s.name}: ${s.values[i]}`).join('<br>'))}"><line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T + ih}"/><rect x="${x(i) - iw / (labels.length - 1) / 2}" y="${T}" width="${iw / (labels.length - 1)}" height="${ih}"/></g>`).join('');
  return `<div class="chart-legend">${series.map(s => `<span><i class="key" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join(' and '))} per week">${grid}<line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" stroke="var(--axis)"/>${xl}${lines}${dots}${cols}</svg>
    <details class="chart-table"><summary>Show as table</summary><div class="table-wrap"><table class="table"><thead><tr><th>Week ending</th>${series.map(s => `<th class="num">${s.name}</th>`).join('')}</tr></thead>
    <tbody>${labels.map((l, i) => `<tr><td>${tipLabel(i).replace('Week ending ', '')}</td>${series.map(s => `<td class="num">${s.values[i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}
function spendInScope(){
  const by = {}; let total = 0;
  scopeIds().forEach(id => Object.entries(SPEND[id]).forEach(([c, v]) => { by[c] = (by[c] || 0) + v; total += v; }));
  reqsInScope().forEach(r => r.c.forEach(x => { by[r.cat] = (by[r.cat] || 0) + x.amt; total += x.amt; }));
  return { by, total };
}

    </div>

const PRI_RANK = { emergency:0, urgent:1, routine:2, planned:3 };
const RQ_VIEWS = [
  { id:'open',    label:'Open',                fn: r => OPEN.includes(r.status) },
  { id:'new',     label:'New',                 fn: r => r.status === 'new' },
  { id:'late',    label:'Past target',         fn: r => isLate(r) },
  { id:'waiting', label:'Waiting',             fn: r => r.status === 'waiting' },
  { id:'done',    label:'Completed',           fn: r => r.status === 'done' },
  { id:'all',     label:'All',                 fn: () => true }
];
function rqFiltered(){
  const f = state.rq, view = RQ_VIEWS.find(v => v.id === f.view) || RQ_VIEWS[0];
  let rs = reqsInScope().filter(view.fn);
  if (f.site) rs = rs.filter(r => r.site === f.site);
  if (f.cat) rs = rs.filter(r => r.cat === f.cat);

}

function recipientName(who, r){
  return { Operations:`Operations (${OPS_NAME})`, Requester:r.by, 'Site PM':SITE[r.site].pm || 'Operations', 'Site SPM':SITE[r.site].spm || 'Operations', Vendor:'Vendor' }[who];

function notesFor(ruleId, r){
  const rule = RULES.find(x => x.id === ruleId); if (!rule || rule.off) return [];
  return rule.rcp.filter(x => x.on.length && !(x.who === 'Requester' && r.src !== 'request')).map(x => ({
    who:x.who, chans:x.on.slice(), icon:x.on.includes('email') && x.on.length === 1 ? 'mail' : 'chat',
    text:`${x.on.map(c => CH[c].label).join(' + ')} → ${recipientName(x.who, r)}`, ruleId
  }));
}
function activity(r){
  const A = [], sub = d(r.at);
  const add = (at, icon, html, extra) => A.push({ at: at instanceof Date ? at : d(at), icon, html, ...extra });
  add(sub, 'plus', r.src === 'request' ? `Submitted by <b>${esc(r.by)}</b>` : `Created automatically by the ${r.src === 'recurring' ? 'recurring service schedule' : 'compliance tracker'}${r.due ? ` (due ${fmtD(d(r.due))})` : ''}`);
  if (r.src === 'request') notesFor(r.pri === 'emergency' ? 'emergency' : 'new', r).forEach(n => add(plusMin(sub, 1), n.icon, esc(n.text), { note:n }));
  if (r.vendor && !r.ev.some(e => e.vendorSet)) add(plusMin(sub, r.pri === 'emergency' ? 12 : 40), 'user', `<b>${esc(OPS_NAME)}</b> assigned ${esc(VENDOR[r.vendor].name)}`);
  r.v.forEach((v, i) => {
    const booked = v.booked ? d(v.booked) : new Date(Math.max(plusMin(sub, 50 + i).getTime(), Math.min(d(v.at).getTime() - HOUR, sub.getTime() + 26 * HOUR)));
    add(booked, 'cal', `Visit booked: ${fmtDT(d(v.at))}–${fmtT(visitEnd(v))} · ${esc(v.what)}`);
    notesFor('visit', r).forEach(n => add(plusMin(booked, 1), n.icon, esc(n.text), { note:{ ...n, visit:i } }));
    if (v.unit) notesFor('unit', r).forEach(n => add(plusMin(booked, 2), 'lock', `Entry-notice reminder queued for ${fmtD(new Date(d(v.at).getTime() - 2 * DAY))}: ${esc(n.text)}`, { note:{ ...n, visit:i } }));
    if (v.done) add(visitEnd(v), 'check', `Visit done: ${esc(v.what)}`);
  });
  r.c.forEach(c => { const last = r.v.filter(v => v.done).map(visitEnd).sort((a, b) => b - a)[0] || plusMin(sub, 90); if (!c.added) add(plusMin(last, 30), 'dollar', `Cost added: ${esc(c.what)} · ${money(c.amt)} · invoice ${esc(c.inv)}`); });
  if (r.status === 'waiting' && r.wait && !r.ev.some(e => e.status)){ const lv = r.v.filter(v => v.done).map(visitEnd).sort((a, b) => b - a)[0] || plusMin(sub, 120); add(plusMin(lv, 45), 'clock', `Status set to Waiting: ${esc(r.wait)}`); }
  r.log.forEach(l => add(l.at, 'chat', `<b>${esc(l.who)}</b> commented`, { comment:l.text }));
  if (r.status === 'done' && r.done && !r.ev.some(e => e.status)){ add(r.done, 'check', `<b>${esc(OPS_NAME)}</b> marked it completed`); notesFor('done', r).forEach(n => add(plusMin(d(r.done), 1), n.icon, esc(n.text), { note:n })); }
  r.ev.forEach(e => add(e.at, e.icon, e.html, e));
  return A.sort((a, b) => a.at - b.at);
}

function bookVisit(id){

  const text = `${r.id} · ${r.title}\nSite: ${s.name} (${r.loc})\nPriority: ${PRI[r.pri].label}\n\n${r.desc}${r.access ? `\n\nAccess: ${r.access}` : ''}\n\nSite contact: ${s.pm || OPS_NAME} (PM)\nDGM Operations: ${OPS_NAME}`;
  explain('copy', {}, () => copyText(text));
}

/* ── Notification preview (what the relay flow delivers) ── */
function previewNote(id, note){
  const r = REQ[id], chans = note.chans;
  const tab = c => `<button type="button" class="chip" aria-pressed="false" data-ch="${c}" onclick="showPv('${c}')">${ic(CH[c].icon)}${CH[c].label}</button>`;
  openModal(`<div class="modal-head"><div><div class="section-label">Notification preview</div><div class="modal-title">${esc(note.text)}</div></div>${X_BTN}</div>
    <div class="modal-body"><div class="pv-tabs">${chans.map(tab).join('')}</div>
      ${chans.map(c => `<div class="pv-stage" data-pv="${c}" hidden>${noticeHtml(r, note, c)}</div>`).join('')}
      <div class="note">${ic('info')}<span>Built by the app from the <code>${note.ruleId}</code> rule and queued in <code>NotificationQueue</code>. The relay flow sends it unchanged.</span></div></div>
    <div class="modal-foot"><button type="button" class="btn btn-primary" data-close>Close</button></div>`, true);
  showPv(chans[0]);
}
function showPv(c){ document.querySelectorAll('[data-pv]').forEach(el => { el.hidden = el.dataset.pv !== c; }); document.querySelectorAll('[data-ch]').forEach(el => el.setAttribute('aria-pressed', el.dataset.ch === c)); }
function noticeHtml(r, note, ch){
  const s = SITE[r.site], v = note.visit != null ? r.v[note.visit] : null, who = recipientName(note.who, r);
  let head, body, facts, btns;
  if (note.ruleId === 'visit' || note.ruleId === 'unit'){
    head = note.ruleId === 'unit' ? `Entry notice needed: ${esc(r.loc)}` : `Vendor visit booked: ${esc(r.title)}`;
    facts = [['When', `${WD[d(v.at).getDay()]} ${fmtD(d(v.at))}, ${visitWindow(v)}`], ['Vendor', esc(VENDOR[r.vendor]?.name || '')], ['Where', esc(whereText(r))], ['What', esc(v.what)]];
    body = note.ruleId === 'unit' ? `A vendor will be inside ${esc(r.loc)}. Please give the resident entry notice before the visit.` : '';
    btns = ['Open request'];
  } else if (note.ruleId === 'done'){
    head = `Completed: ${esc(r.title)}`; facts = [['Where', esc(whereText(r))], ['Vendor', esc(VENDOR[r.vendor]?.name || '—')]];
    body = 'Operations marked this request complete. If the problem comes back, open the request and choose “Still a problem.”'; btns = ['Open request'];
  } else if (!['new','emergency'].includes(note.ruleId)){
    head = { status:`Status update: ${esc(r.title)}`, comment:`New comment: ${esc(r.title)}`, late:`Past response target: ${esc(r.title)}`, compliance:'Compliance date coming up' }[note.ruleId] || esc(r.title);
    facts = [['Where', esc(whereText(r))], ['Status', STATUS[r.status].label]];
    body = { status:`Status is now ${STATUS[r.status].label}. ${esc(r.wait || '')}`, comment: esc(r.log[r.log.length - 1]?.text || 'Operations added a comment.'), late:`No vendor visit yet. The ${PRI[r.pri]?.target || ''} response target has passed.`, compliance:'Backflow assembly test at Stark was due Sep 10. A vendor is booked for Sep 25.' }[note.ruleId] || '';
    btns = ['Open request'];
  } else {
    const em = r.pri === 'emergency';
    head = note.who === 'Requester' ? `We got your request: ${esc(r.title)}` : `${em ? 'Emergency request' : 'New request'}: ${esc(r.title)}`;
    facts = [['Where', esc(whereText(r))], ['Priority', `${PRI[r.pri].label} (vendor on site within ${PRI[r.pri].target})`], ['Category', esc(catLabel(r.cat))], ['Submitted by', esc(r.by)]];
    body = note.who === 'Requester' ? 'Operations will review it and book a vendor. You’ll get updates here.' : esc(r.desc);
    btns = note.who === 'Operations' ? ['Open request', 'Assign vendor'] : ['Open request'];
  }
  const btnHtml = btns.map((b, i) => `<button type="button" class="tm-btn${i ? '' : ' pri'}" onclick="explain('${i ? 'assignTeams' : 'openTeams'}')">${b}</button>`).join('');
  if (ch === 'email') return `<div class="em-wrap"><dl class="em-head"><dt>From</dt><dd>DGM Maintenance Requests &lt;maintenance@dogoodmultnomah.org&gt;</dd><dt>To</dt><dd>${esc(who)}</dd><dt>Subject</dt><dd class="em-subj">${r.id}: ${head}</dd></dl>
      <div class="em-body"><p>Hi ${esc(who.split(' ')[0].replace('Operations', 'Operations team'))},</p><p style="margin-top:8px">${body || head}</p>
      <p style="margin-top:8px">${facts.map(([k, x]) => `<b>${k}:</b> ${x}`).join('<br>')}</p><span class="em-btn" role="button" tabindex="0" onclick="explain('openTeams')">View request ${r.id}</span></div></div>`;
  return `${ch === 'channel' ? `<div class="tm-channel">${ic('hash')} Operations › Maintenance</div>` : `<div class="tm-channel">${ic('chat')} Chat with ${esc(who)}</div>`}
    <div class="tm-msg"><div class="tm-bot">${ic('wrench')}</div><div style="min-width:0;flex:1"><div class="tm-meta"><b>Maintenance Requests</b> (bot) · ${fmtT(d(r.at))}</div>
      <div class="tm-card"><div class="tm-card-band${r.pri === 'emergency' && !['visit','unit','done'].includes(note.ruleId) ? ' em' : ''}"></div><div class="tm-card-body">
        <div class="tm-card-title">${head}</div><div style="font-size:12px;color:#616161">${r.id} · ${esc(s.name)}</div>
        <dl class="tm-facts">${facts.map(([k, x]) => `<dt>${k}</dt><dd>${x}</dd>`).join('')}</dl>${body ? `<div style="font-size:13px">${body}</div>` : ''}</div>
        <div class="tm-actions">${btnHtml}</div></div></div></div>`;
}

/* ════════════════════════ REPORT A PROBLEM ════════════════════════ */
const SETTINGS = {
  emergencyMsg:'If anyone is in danger, follow your site’s emergency procedures first. Then call your PM. They’ll decide whether to call a vendor or Operations.',
  channel:'Operations › Maintenance', mailbox:'maintenance@dogoodmultnomah.org'
};
function newForm(){ return { site: me().home, loc:'', asset:'', cat:'', danger:null, usable:null, title:'', desc:'', access:'', ir:'', photos:0, errors:[], submitted:null }; }
function formPri(f){ return f.danger === true ? 'emergency' : f.danger === false && f.usable === false ? 'urgent' : f.danger === false && f.usable === true ? 'routine' : null; }
function renderReport(){
  const f = state.form ||= newForm();
  if (f.submitted) return renderSubmitted(REQ[f.submitted]);
  const s = SITE[f.site], L = siteLocations(s), pri = formPri(f);
  const cats = CATS.filter(c => (!c.kitchenOnly || s.kitchen) && (!c.types || c.types.includes(s.type)));
  const siteAssets = optOn() ? ASSETS.filter(a => a.site === f.site) : [];
  const yn = (key, val, label, danger) => `<button type="button" class="${danger ? 'danger' : ''}" aria-pressed="${f[key] === val}" onclick="state.form.${key}=${val};${key === 'danger' ? 'state.form.usable=null;' : ''}render()">${label}</button>`;
  const err = k => f.errors.includes(k) ? ' style="border-color:var(--warn)"' : '';
  return `<div class="page page-sm">
    <div class="page-head"><div><h1 class="page-title">Report a problem</h1><div class="page-sub">Tell Operations what needs fixing. It takes about a minute.</div></div></div>
    ${bn('<b>Report a problem</b> · creates a <b>MaintenanceRequests</b> item. SPFx fills in the requester from the M365 profile, the site from the profile’s office location (same as IR), the priority from the answers below, and <b>TargetAt</b>. Then it queues notifications per the rules. The relay flow only sends them.')}

    <section class="form-sec"><div class="form-sec-head"><span class="step-n">1</span><h2 class="form-sec-title">Where is it?</h2></div>
      <div class="form-grid">
        <label class="field"><span class="field-label">Site <span class="req">*</span></span>
          <select class="select" id="fSite" onchange="state.form.site=this.value;state.form.loc='';state.form.asset='';state.form.cat='';render()">${SITES.map(x => `<option value="${x.id}"${x.id === f.site ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
          <span class="field-hint">Filled in from your profile. Change it if you’re covering another site.</span></label>
        <label class="field"><span class="field-label">Location <span class="req">*</span></span>
          <select class="select" id="fLoc"${err('loc')} onchange="state.form.loc=this.value;render()"><option value="">Choose a location…</option>
            <optgroup label="Common areas">${L.common.map(x => `<option${x === f.loc ? ' selected' : ''}>${esc(x)}</option>`).join('')}</optgroup>
            ${L.units.length ? `<optgroup label="${L.unitLabel}">${L.units.map(x => `<option${x === f.loc ? ' selected' : ''}>${esc(x)}</option>`).join('')}</optgroup>` : ''}</select>
          <span class="field-hint">${L.units.length ? `Pick the exact ${L.unitLabel.toLowerCase().slice(0, -1)} if it’s inside one.` : 'Locations are managed per site in Settings.'}</span></label>
      </div>
      ${siteAssets.length ? `<label class="field" style="margin-top:14px"><span class="field-label">Specific equipment ${optBadge()} <span class="muted" style="font-weight:400">(optional)</span></span>
        <select class="select" id="fAsset" onchange="state.form.asset=this.value"><option value="">Not sure / not listed</option>${siteAssets.map(a => `<option value="${a.tag}"${a.tag === f.asset ? ' selected' : ''}>${esc(a.name)} · ${a.tag}</option>`).join('')}</select>
        <span class="field-hint">Scanning the QR label on equipment opens this form with it already picked.</span></label>` : ''}
    </section>

    <section class="form-sec"${err('cat')}><div class="form-sec-head"><span class="step-n">2</span><h2 class="form-sec-title">What kind of problem?</h2></div>
      <div class="cat-grid" role="group" aria-label="Category">${cats.map(c => `<button type="button" class="cat-btn" aria-pressed="${f.cat === c.id}" onclick="state.form.cat='${c.id}';render()">${ic(c.icon)}<span>${esc(c.label)}</span></button>`).join('')}</div>
      ${s.kitchen ? '' : `<div class="field-hint" style="margin-top:8px">Kitchen equipment appears for sites with a full kitchen.</div>`}
    </section>

    <section class="form-sec"${err('urg')}><div class="form-sec-head"><span class="step-n">3</span><h2 class="form-sec-title">How urgent is it?</h2></div>
      <p class="q">Is anyone in danger, or is there active flooding, fire, a gas smell, sparking, or an outside door that won’t lock?</p>
      <div class="yn">${yn('danger', false, 'No')}${yn('danger', true, 'Yes, it’s an emergency', true)}</div>
      ${f.danger === true ? `<div class="emerg" role="alert"><div class="emerg-title">${ic('alert')}Emergency: do this now</div>
          <p style="font-size:13px;line-height:1.6">${esc(SETTINGS.emergencyMsg)}</p>
          <p style="font-size:13px;line-height:1.6;margin-top:6px">Then finish this form. Operations and your PM get an immediate Teams alert and email.</p></div>` : ''}
      ${f.danger === false ? `<p class="q" style="margin-top:16px">Can people still use the space or equipment?</p>
        <div class="yn">${yn('usable', true, 'Yes, it can wait a bit')}${yn('usable', false, 'No, it’s out of use')}</div>` : ''}
      ${pri ? `<div class="result-pri">This will be sent as ${priPill(pri)}<span>Goal: a vendor on site within ${PRI[pri].target}. Operations can adjust this.</span></div>` : ''}
    </section>

    <section class="form-sec"><div class="form-sec-head"><span class="step-n">4</span><h2 class="form-sec-title">Details</h2></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <label class="field"><span class="field-label">Short summary <span class="req">*</span></span>
          <input class="input" id="fTitle"${err('title')} maxlength="80" placeholder="e.g. No hot water in the hygiene trailer" value="${esc(f.title)}" oninput="state.form.title=this.value"></label>
        <label class="field"><span class="field-label">What’s happening? <span class="req">*</span></span>
          <textarea class="textarea" id="fDesc"${err('desc')} placeholder="What you noticed, when it started, and anything you’ve already tried" oninput="state.form.desc=this.value">${esc(f.desc)}</textarea></label>
        <div class="field"><span class="field-label">Photos <span class="muted" style="font-weight:400">(optional, up to 5)</span></span>
          <div class="upload"><button type="button" class="btn" onclick="explain('photo',{},()=>{state.form.photos=Math.min(5,state.form.photos+1);render()})">${ic('camera')}Add photo</button>
            <span class="field-hint">On a phone, this opens your camera.</span>
            ${f.photos ? `<div class="photos" style="margin:0">${Array.from({ length:f.photos }, (_, i) => `<div class="photo">${ic('camera')}photo-${i + 1}.jpg</div>`).join('')}</div>` : ''}</div></div>
        <label class="field"><span class="field-label">Access notes for the vendor <span class="muted" style="font-weight:400">(optional)</span></span>
          <input class="input" id="fAccess" placeholder="e.g. Resident works nights. Visit after 1 pm." value="${esc(f.access)}" oninput="state.form.access=this.value">
          ${isUnit(f.loc) ? `<span class="field-hint">${ic('lock')} This is inside a resident’s unit. Your PM is reminded to give entry notice before any visit.</span>` : ''}</label>
        <label class="field"><span class="field-label">Related incident report <span class="muted" style="font-weight:400">(optional)</span></span>
          <input class="input mono" id="fIR" placeholder="IR-2026-0000" value="${esc(f.ir)}" oninput="state.form.ir=this.value">
          <span class="field-hint">If this came from an incident (break-in, vandalism, fire), add the IR number so the two records link.</span></label>
      </div>
    </section>
    ${f.errors.length ? `<div class="note warn" role="alert" style="margin-bottom:14px">${ic('alert')}<span>Please finish: ${f.errors.map(k => ({ loc:'the location', cat:'the kind of problem', urg:'the urgency questions', title:'a short summary', desc:'what’s happening' }[k])).join(', ')}.</span></div>` : ''}
    <div class="btn-row" style="justify-content:flex-end">
      <button type="button" class="btn btn-lg" onclick="state.form=newForm();render()">Clear</button>
      <button type="button" class="btn btn-lg btn-primary" onclick="submitForm()">Submit request</button>
    </div>
  </div>`;
}
function submitForm(){
  const f = state.form, e = [];
  if (!f.loc) e.push('loc'); if (!f.cat) e.push('cat'); if (!formPri(f)) e.push('urg');
  if (!f.title.trim()) e.push('title'); if (!f.desc.trim()) e.push('desc');
  f.errors = e; if (e.length){ render(); return; }
  const id = `MR-2026-${String(state.seq).padStart(4, '0')}`;
  const r = { id, at: iso(now()), site:f.site, loc:f.loc, cat:f.cat, pri:formPri(f), status:'new', by: me().person, title:f.title.trim(), desc:f.desc.trim(),
    access:f.access.trim() || undefined, ir:f.ir.trim() || undefined, ph:f.photos || undefined, asset:f.asset || undefined, v:[], c:[], log:[], ev:[], src:'request' };
  explain('submit', r, () => { state.seq++; REQUESTS.push(r); REQ[id] = r; f.submitted = id; render(); window.scrollTo(0, 0); });
}
function renderSubmitted(r){
  const notes = notesFor(r.pri === 'emergency' ? 'emergency' : 'new', r);
  const ops = notes.find(n => n.who === 'Operations');
  return `<div class="page page-sm"><div class="card confirm">
    <div class="confirm-ico">${ic('check')}</div>
    <h1 class="page-title">Request ${r.id} submitted</h1>
    <p class="page-sub" style="margin-top:4px">${esc(r.title)} · ${esc(whereText(r))}</p>
    <div class="next-steps">
      ${notes.map(n => `<div class="next-step">${ic(n.icon)}<span>${esc(n.text)}</span></div>`).join('')}
      <div class="next-step">${ic('clock')}<span>Goal: a vendor on site within <b>${PRI[r.pri].target}</b>. Follow progress in My requests.</span></div>
    </div>
    <div class="btn-row" style="justify-content:center">
      ${ops ? `<button type="button" class="btn" onclick='previewNote("${r.id}",${JSON.stringify(ops)})'>${ic('chat')}Preview the Teams alert</button>` : ''}
      <button type="button" class="btn" onclick="state.form=newForm();render()">Report another problem</button>
      <button type="button" class="btn btn-primary" onclick="state.form=null;go('mine');openReq('${r.id}')">View my request</button>
    </div></div></div>`;
}

/* ════════════════════════ MY REQUESTS ════════════════════════ */
const STEPS = ['Submitted', 'Scheduled', 'In progress', 'Completed'];
const STEP_OF = { new:0, scheduled:1, inprog:2, waiting:2, done:3 };
function renderMine(){
  const rs = myRequests(), upcoming = upcomingVisits(7, rs);
  return `<div class="page page-sm">
    <div class="page-head"><div><h1 class="page-title">My requests</h1><div class="page-sub">Everything you’ve reported and where it stands.</div></div>
      <button type="button" class="btn btn-primary" onclick="go('report')">${ic('plus')}Report a problem</button></div>
    ${bn('<b>My requests</b> · MaintenanceRequests filtered to <b>Author = me</b>. List setting: people read only their own items. PM, SPM and Operations get a permission level with “Override list behaviors” so the app can read their sites.')}
    ${upcoming.length ? `<div class="banner">${ic('cal')}<span>${upcoming.map(({ r, v, t }) => `${esc(VENDOR[r.vendor]?.name || 'A vendor')} is booked for <b>${esc(r.loc)}</b> on ${WD[t.getDay()]} ${fmtD(t)}, ${visitWindow(v)}`).join('. ')}.</span></div>` : ''}
    ${rs.length ? `<div class="grid">${rs.map(r => {

      return `<button type="button" class="req-card" onclick="openReq('${r.id}')">
        <div class="req-top"><div style="min-width:0"><div class="li-title">${esc(r.title)}</div><div class="li-meta"><span class="mono">${r.id}</span><span>${esc(whereText(r))}</span><span>${fmtD(d(r.at))}</span></div></div>
          <div class="btn-row">${r.pri === 'emergency' || r.pri === 'urgent' ? priPill(r.pri) : ''}${statusPill(r)}</div></div>
        ${step != null ? `<div class="stepper" aria-label="Progress: ${STATUS[r.status].label}">${STEPS.map((l, i) => `<div class="stp${i <= step ? ' on' : ''}${i === step ? ' cur' : ''}"><div class="stp-bar"></div><div class="stp-l">${i === 2 && r.status === 'waiting' ? 'Waiting' : l}</div></div>`).join('')}</div>` : ''}
        <div class="req-update">${ic(last?.comment ? 'chat' : 'info')}<span>${last?.comment ? `<b>${esc(last.html.replace(/<[^>]+>/g, '').replace(' commented', ''))}:</b> ${esc(last.comment)}` : nv ? `Vendor visit ${WD[nv.getDay()]} ${fmtD(nv)}, ${fmtT(nv)}` : r.status === 'waiting' ? esc(r.wait) : r.status === 'new' ? 'Waiting for Operations to review.' : r.status === 'done' ? `Completed ${fmtD(d(r.done))}. Still a problem? Open it to let Operations know.` : esc(last ? last.html.replace(/<[^>]+>/g, '') : '')}</span></div>
      </button>`; }).join('')}</div>`
    : `<div class="card empty">You haven’t reported anything yet.<div style="margin-top:12px"><button type="button" class="btn btn-primary" onclick="go('report')">${ic('plus')}Report a problem</button></div></div>`}
  </div>`;
}

/* ════════════════════════ SCHEDULE ════════════════════════ */
const TL_WEEKS = Array.from({ length:13 }, (_, i) => new Date(2026, 8, 21 + i * 7));   // Mondays from Sep 21
function renderSchedule(){
  const visits = upcomingVisits(14), byDay = {};
  visits.forEach(x => { (byDay[sod(x.t).getTime()] ||= []).push(x); });
  const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);
  const recur = optOn() ? RECURRING.map(rs => ({ ...rs, mine: rs.sites.filter(inScope) })).filter(rs => rs.mine.length) : [];
  return `<div class="page">
    <div class="page-head"><div><h1 class="page-title">Schedule</h1><div class="page-sub">Vendor visits booked on requests${optOn() ? ', plus recurring services' : ''}. Site PMs get a Teams message when a visit is booked.</div></div>${scopeChip()}</div>
    ${bn('<b>Schedule</b> · visits are rows on each request (child list <b>RequestVisits</b>). Optional: the app can also write them to the Operations group calendar through Microsoft Graph, so they show in Outlook and Teams.')}
    <section class="card" style="margin-bottom:14px"><div class="card-head"><h2 class="card-title">Vendors on site, next 14 days</h2><span class="card-sub">${visits.length} visit${visits.length === 1 ? '' : 's'}</span></div>
      ${days.length ? days.map(k => { const dd = new Date(k), today = daysFromToday(dd) === 0; return `<div class="agenda-day">
        <div class="agenda-date${today ? ' today' : ''}"><b>${today ? 'Today' : daysFromToday(dd) === 1 ? 'Tomorrow' : WD[dd.getDay()]}</b>${fmtD(dd)}</div>
        <div>${byDay[k].map(({ r, v }) => `<button type="button" class="visit" onclick="openReq('${r.id}')"><span class="visit-time">${visitWindow(v)}</span>
          <span class="visit-body"><span class="li-title" style="display:block">${esc(VENDOR[r.vendor]?.name || 'Vendor')} · ${esc(v.what)}</span>
          <span class="li-meta"><span>${esc(whereText(r))}</span><span class="mono">${r.id}</span>${v.unit ? `<span class="pill p-amber">${ic('lock')}In a unit, entry notice needed</span>` : ''}${r.src === 'recurring' ? '<span class="pill p-planned">Recurring</span>' : ''}</span></span></button>`).join('')}</div></div>`; }).join('')
      : `<div class="empty">No vendor visits booked in the next two weeks.</div>`}
    </section>
    ${optOn() ? `<section class="card">
      <div class="card-head"><h2 class="card-title">Recurring services ${optBadge()}</h2>
        ${canManage() ? `<button type="button" class="btn btn-sm" onclick="explain('addRecurring')">${ic('plus')}Add recurring service</button>` : ''}</div>
      ${bn('<b>RecurringServices</b> list. When Operations opens the app each day, SPFx creates any request that is due within its lead time. Each has a unique service + date key, so none are duplicated. <b>No scheduler flow.</b>')}
      <div class="chart-legend"><span><i class="tl-dot" style="display:inline-block;width:10px;height:10px"></i>Service visit (one request per site)</span></div>
      <div style="overflow-x:auto"><div class="tl" role="table" aria-label="Recurring services over the next 13 weeks">
        <div class="tl-h" style="text-align:left">Service</div>${TL_WEEKS.map((w, i) => `<div class="tl-h${i === 0 ? ' now' : ''}">${i === 0 ? 'This wk' : fmtD(w)}</div>`).join('')}
